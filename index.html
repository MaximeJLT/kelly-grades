<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Jury Results - Kelly</title>
    <!-- Retro Pixel Art Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Lightweight Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a0a2a;
            background-image: 
                radial-gradient(#ff007f 15%, transparent 16%),
                radial-gradient(#00ffff 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            font-family: 'Press Start 2P', cursive;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 20px;
        }

        /* --- SCREEN 1: THE ENVELOPE --- */
        #envelope-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .instruction {
            font-size: 0.9rem;
            color: #00ffff;
            text-shadow: 2px 2px 0px #000;
            animation: blink 1.2s infinite;
        }

        /* Pixel Art Envelope */
        .envelope {
            background: #ffe6f2;
            border: 6px solid #000000;
            width: 320px;
            height: 220px;
            position: relative;
            cursor: pointer;
            box-shadow: 10px 10px 0px #ff007f;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .envelope:hover {
            transform: translate(-4px, -4px);
            box-shadow: 14px 14px 0px #ff007f;
        }

        .envelope:active {
            transform: translate(2px, 2px);
            box-shadow: 6px 6px 0px #ff007f;
        }

        /* Envelope Flaps in CSS */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 154px solid transparent;
            border-right: 154px solid transparent;
            border-top: 90px solid #ff80bf;
            pointer-events: none;
        }

        .stamp {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 50px;
            border: 3px dashed #ff007f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: #ff007f;
        }

        .label {
            background: #ffffff;
            border: 4px solid #000000;
            padding: 15px 10px;
            width: 80%;
            color: #000000;
            font-size: 0.8rem;
            line-height: 1.4;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .label span {
            color: #ff007f;
            font-size: 0.9rem;
        }

        /* --- SCREEN 2: THE RESULT --- */
        #result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .header-text {
            color: #00ffff;
            font-size: 1rem;
            line-height: 1.6;
            text-shadow: 3px 3px 0px #000;
        }

        .score-box {
            background: #000000;
            border: 6px solid #ff007f;
            padding: 30px 20px;
            box-shadow: 10px 10px 0px #00ffff;
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        .score-number {
            font-size: 1.5rem;
            color: #ffff00;
            line-height: 1.5;
            word-break: break-all;
            text-shadow: 3px 3px 0px #ff0000;
            margin-bottom: 10px;
        }

        .score-base {
            font-size: 1.2rem;
            color: #ffffff;
        }

        .verdict {
            background: #ff007f;
            color: #ffffff;
            padding: 15px;
            border: 4px solid #000;
            font-size: 0.75rem;
            line-height: 1.6;
            box-shadow: 6px 6px 0px #000;
            max-width: 550px;
        }

        /* Ta signature secrète / clin d'œil */
        .signature {
            font-size: 0.65rem;
            color: #00ffff;
            text-shadow: 2px 2px 0px #000;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* --- ANIMATIONS --- */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .score-number { font-size: 1.1rem; }
            .envelope { width: 280px; height: 190px; }
            .label { font-size: 0.7rem; }
            .signature { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Envelope Screen -->
        <div id="envelope-screen">
            <div class="instruction">▶ CLICK THE LETTER TO OPEN ◀</div>
            <div class="envelope" onclick="openEnvelope()">
                <div class="stamp">♥</div>
                <div class="label">
                    FILE:<br><br>
                    <span>KELLY GRADES</span>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen">
            <div class="header-text">
                ★ OFFICIAL DELIBERATION ★<br>
                International Beauty Jury
            </div>

            <div class="score-box">
                <div class="score-number" id="counter">0</div>
                <div class="score-base">/ 10</div>
            </div>

            <div class="verdict">
                VERDICT: OFF THE CHARTS.<br><br>
                The standard 10-point scale exploded when facing such perfection.
            </div>

            <div class="signature">
                finally graded by Maxime.. =)))
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            // Hide envelope
            const envScreen = document.getElementById('envelope-screen');
            envScreen.style.opacity = '0';
            envScreen.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                envScreen.style.display = 'none';
                // Show result
                const resScreen = document.getElementById('result-screen');
                resScreen.style.display = 'flex';
                
                // Launch confetti
                launchConfetti();
                
                // Animate numbers
                animateScore();
            }, 500);
        }

        function animateScore() {
            const counterEl = document.getElementById('counter');
            const target = "10,000,000,000,000";
            let current = 0;
            
            // Random numbers scrolling effect before showing final score
            const interval = setInterval(() => {
                counterEl.innerText = Math.floor(Math.random() * 9999999999999).toLocaleString('en-US');
                current++;
                if (current > 15) {
                    clearInterval(interval);
                    counterEl.innerText = target;
                    // Final confetti explosion
                    launchConfetti();
                }
            }, 60);
        }

        function launchConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff007f', '#00ffff', '#ffff00', '#ffffff']
            });
        }
    </script>
</body>
</html>
