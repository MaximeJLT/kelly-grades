<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Official Results - Kelly</title>
    <!-- Police Pixel Art -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom);
            background-color: #f0f2f5; /* Fond gris très clair et sobre */
            font-family: 'Press Start 2P', monospace;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- ÉCRAN 1 : L'ENVELOPPE BLANCHE --- */
        #envelope-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .instruction {
            font-size: 0.7rem;
            color: #555555;
            animation: blink 1.5s infinite;
            letter-spacing: 1px;
        }

        .envelope {
            background: #ffffff;
            border: 3px solid #111111;
            width: 280px;
            height: 180px;
            position: relative;
            cursor: pointer;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.15s, box-shadow 0.15s;
            touch-action: manipulation;
        }

        .envelope:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
        }

        /* Lignes du rabat de l'enveloppe */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 137px solid transparent;
            border-right: 137px solid transparent;
            border-top: 75px solid #e4e6eb;
            pointer-events: none;
        }

        .stamp {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 38px;
            border: 2px dotted #d32f2f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: #d32f2f;
        }

        .label {
            background: #ffffff;
            border: 2px solid #111111;
            padding: 12px 10px;
            width: 75%;
            font-size: 0.65rem;
            line-height: 1.6;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .label strong {
            color: #d32f2f;
            font-size: 0.75rem;
        }

        /* --- ÉCRAN 2 : LE PAPIER ÉPURÉ --- */
        #paper-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 3px solid #111111;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
            padding: 35px 20px;
            width: 100%;
            gap: 30px;
            animation: slideUpPaper 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ai-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #111111;
            line-height: 1.4;
        }

        /* Le monocle dessiné en SVG Pixel Art */
        .pixel-monocle {
            width: 22px;
            height: 22px;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        /* Zone de la note (style tampon rouge) */
        .grade-box {
            border: 3px solid #d32f2f;
            padding: 30px 10px;
            width: 100%;
            background: #fffafa;
            position: relative;
        }

        .score-number {
            font-size: clamp(0.9rem, 4.5vw, 1.3rem);
            color: #d32f2f;
            line-height: 1.4;
            margin-bottom: 10px;
            white-space: nowrap;
            font-weight: bold;
        }

        .score-base {
            font-size: 0.9rem;
            color: #111111;
        }

        /* Petite phrase de fin */
        .signature-area {
            font-size: 0.65rem;
            color: #444444;
            line-height: 1.5;
        }

        /* --- ANIMATIONS --- */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes slideUpPaper {
            0% { transform: translateY(60px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Écran de l'enveloppe -->
        <div id="envelope-screen">
            <div class="instruction">▶ TAP ENVELOPE TO OPEN ◀</div>
            <div class="envelope" onclick="openEnvelope()">
                <div class="stamp">★</div>
                <div class="label">
                    OFFICIAL REPORT<br><br>
                    TO: <strong>KELLY</strong>
                </div>
            </div>
        </div>

        <!-- Écran de la feuille épurée -->
        <div id="paper-screen">
            
            <!-- Titre + Émoji Monocle Pixel Art -->
            <div class="ai-header">
                <span>judged by Maxime's AI :</span>
                <svg class="pixel-monocle" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFCC00" d="M4,2 h8 v1 h2 v1 h1 v8 h-1 v1 h-2 v1 h-8 v-1 h-2 v-1 h-1 v-8 h1 v-1 h2 z"/>
                    <rect x="4" y="6" width="2" height="2" fill="#000000"/>
                    <rect x="4" y="4" width="2" height="1" fill="#000000"/>
                    <rect x="9" y="3" width="3" height="1" fill="#000000"/>
                    <rect x="9" y="6" width="2" height="2" fill="#000000"/>
                    <path fill="none" stroke="#000000" stroke-width="1" d="M7.5,4.5 h5 v5 h-5 z"/>
                    <rect x="8" y="5" width="1" height="1" fill="#FFFFFF"/>
                    <rect x="12" y="7" width="1" height="1" fill="#000000"/>
                    <rect x="13" y="8" width="1" height="1" fill="#000000"/>
                    <rect x="13" y="9" width="1" height="3" fill="#000000"/>
                    <rect x="6" y="10" width="4" height="1" fill="#000000"/>
                    <rect x="5" y="11" width="1" height="1" fill="#000000"/>
                </svg>
            </div>

            <!-- Juste le score -->
            <div class="grade-box">
                <div class="score-number" id="counter">0</div>
                <div class="score-base">/ 10</div>
            </div>

            <!-- Petite phrase en dessous -->
            <div class="signature-area">
                finally graded by maxime =))))))
            </div>

        </div>
    </div>

    <script>
        function openEnvelope() {
            const envScreen = document.getElementById('envelope-screen');
            envScreen.style.opacity = '0';
            envScreen.style.transform = 'translateY(15px) scale(0.95)';
            
            setTimeout(() => {
                envScreen.style.display = 'none';
                const paperScreen = document.getElementById('paper-screen');
                paperScreen.style.display = 'flex';
                
                launchConfetti();
                animateScore();
            }, 300);
        }

        function animateScore() {
            const counterEl = document.getElementById('counter');
            const target = "10,000,000,000,000";
            let current = 0;
            
            const interval = setInterval(() => {
                counterEl.innerText = Math.floor(Math.random() * 9999999999999).toLocaleString('en-US');
                current++;
                if (current > 12) {
                    clearInterval(interval);
                    counterEl.innerText = target;
                    launchConfetti();
                }
            }, 50);
        }

        function launchConfetti() {
            confetti({
                particleCount: 70,
                spread: 60,
                origin: { y: 0.5 },
                colors: ['#d32f2f', '#111111', '#FFCC00', '#ffffff']
            });
        }
    </script>
</body>
</html>
