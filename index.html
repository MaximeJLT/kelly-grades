<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Optimisation mobile : empêche le zoom accidentel sur iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Official Jury Results - Kelly</title>
    <!-- Retro Pixel Art Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Lightweight Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            /* Supprime le carré gris au tap sur iPhone */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom);
            background-color: #1a0a2a;
            background-image: 
                radial-gradient(#ff007f 15%, transparent 16%),
                radial-gradient(#00ffff 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            font-family: 'Press Start 2P', cursive;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- SCREEN 1: THE ENVELOPE --- */
        #envelope-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .instruction {
            font-size: 0.75rem;
            color: #00ffff;
            text-shadow: 2px 2px 0px #000;
            animation: blink 1.2s infinite;
            line-height: 1.5;
        }

        /* Enveloppe dimensionnée pour écrans iPhone */
        .envelope {
            background: #ffe6f2;
            border: 5px solid #000000;
            width: 280px;
            height: 190px;
            position: relative;
            cursor: pointer;
            box-shadow: 8px 8px 0px #ff007f;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.15s, box-shadow 0.15s;
            touch-action: manipulation;
        }

        .envelope:active {
            transform: translate(3px, 3px);
            box-shadow: 4px 4px 0px #ff007f;
        }

        /* Rabats dessinés en CSS calibrés pour 280px de large */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 135px solid transparent;
            border-right: 135px solid transparent;
            border-top: 80px solid #ff80bf;
            pointer-events: none;
        }

        .stamp {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 35px;
            height: 42px;
            border: 2px dashed #ff007f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            color: #ff007f;
        }

        .label {
            background: #ffffff;
            border: 3px solid #000000;
            padding: 12px 8px;
            width: 82%;
            color: #000000;
            font-size: 0.7rem;
            line-height: 1.4;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .label span {
            color: #ff007f;
            font-size: 0.8rem;
        }

        /* --- SCREEN 2: THE RESULT --- */
        #result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .header-text {
            color: #00ffff;
            font-size: 0.85rem;
            line-height: 1.5;
            text-shadow: 2px 2px 0px #000;
        }

        .score-box {
            background: #000000;
            border: 5px solid #ff007f;
            padding: 22px 10px;
            box-shadow: 8px 8px 0px #00ffff;
            width: 100%;
        }

        /* Taille de police dynamique : s'adapte à la largeur du téléphone ! */
        .score-number {
            font-size: clamp(0.9rem, 4.5vw, 1.3rem);
            color: #ffff00;
            line-height: 1.4;
            text-shadow: 2px 2px 0px #ff0000;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .score-base {
            font-size: 1rem;
            color: #ffffff;
        }

        .verdict {
            background: #ff007f;
            color: #ffffff;
            padding: 14px 10px;
            border: 3px solid #000;
            font-size: 0.68rem;
            line-height: 1.5;
            box-shadow: 5px 5px 0px #000;
            width: 100%;
        }

        .signature {
            font-size: 0.58rem;
            color: #00ffff;
            text-shadow: 1px 1px 0px #000;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* --- ANIMATIONS --- */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Envelope Screen -->
        <div id="envelope-screen">
            <div class="instruction">▶ TAP THE LETTER TO OPEN ◀</div>
            <div class="envelope" onclick="openEnvelope()">
                <div class="stamp">♥</div>
                <div class="label">
                    FILE:<br><br>
                    <span>KELLY GRADES</span>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen">
            <div class="header-text">
                ★ OFFICIAL DELIBERATION ★<br>
                International Beauty Jury
            </div>

            <div class="score-box">
                <div class="score-number" id="counter">0</div>
                <div class="score-base">/ 10</div>
            </div>

            <div class="verdict">
                VERDICT: OFF THE CHARTS.<br><br>
                The standard 10-point scale exploded when facing such perfection.
            </div>

            <div class="signature">
                finally graded by Maxime.. =)))
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            const envScreen = document.getElementById('envelope-screen');
            envScreen.style.opacity = '0';
            envScreen.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                envScreen.style.display = 'none';
                const resScreen = document.getElementById('result-screen');
                resScreen.style.display = 'flex';
                
                launchConfetti();
                animateScore();
            }, 400);
        }

        function animateScore() {
            const counterEl = document.getElementById('counter');
            const target = "10,000,000,000,000";
            let current = 0;
            
            const interval = setInterval(() => {
                // Chiffres aléatoires qui défilent rapidement
                counterEl.innerText = Math.floor(Math.random() * 9999999999999).toLocaleString('en-US');
                current++;
                if (current > 12) {
                    clearInterval(interval);
                    counterEl.innerText = target;
                    launchConfetti();
                }
            }, 50);
        }

        function launchConfetti() {
            confetti({
                particleCount: 80,
                spread: 60,
                origin: { y: 0.6 },
                colors: ['#ff007f', '#00ffff', '#ffff00', '#ffffff']
            });
        }
    </script>
</body>
</html>
